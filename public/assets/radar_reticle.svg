<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#182744" stroke-linecap="round" stroke-linejoin="round">
  <!-- Classical Technical Radar Reticle / Astronomical Celestial Dial -->
  <!-- Outer dotted coordinate circle -->
  <circle cx="60" cy="60" r="54" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.45"/>
  <circle cx="60" cy="60" r="48" stroke-width="1.2" opacity="0.6"/>
  <circle cx="60" cy="60" r="32" stroke-width="0.9" opacity="0.5"/>
  <circle cx="60" cy="60" r="16" stroke-width="0.8" opacity="0.7"/>
  <circle cx="60" cy="60" r="2.5" fill="#182744" stroke="none" opacity="0.85"/>
  
  <!-- Crosshairs -->
  <line x1="60" y1="2" x2="60" y2="118" stroke-width="0.9" opacity="0.55"/>
  <line x1="2" y1="60" x2="118" y2="60" stroke-width="0.9" opacity="0.55"/>
  
  <!-- Tick marks at 45 degree angles -->
  <line x1="22" y1="22" x2="30" y2="30" stroke-width="0.8" opacity="0.4"/>
  <line x1="98" y1="22" x2="90" y2="30" stroke-width="0.8" opacity="0.4"/>
  <line x1="22" y1="98" x2="30" y2="90" stroke-width="0.8" opacity="0.4"/>
  <line x1="98" y1="98" x2="90" y2="90" stroke-width="0.8" opacity="0.4"/>

  <!-- Compass degree marks -->
  <text x="60" y="14" font-family="'IBM Plex Mono', monospace" font-size="5" fill="#182744" text-anchor="middle" opacity="0.5">000°</text>
  <text x="110" y="62" font-family="'IBM Plex Mono', monospace" font-size="5" fill="#182744" text-anchor="middle" opacity="0.5">090°</text>
  <text x="60" y="112" font-family="'IBM Plex Mono', monospace" font-size="5" fill="#182744" text-anchor="middle" opacity="0.5">180°</text>
  <text x="12" y="62" font-family="'IBM Plex Mono', monospace" font-size="5" fill="#182744" text-anchor="middle" opacity="0.5">270°</text>
</svg>
